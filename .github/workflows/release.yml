name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/teacher/src-tauri
            apps/student/src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate icons
        run: python build/convert-icons.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Build Teacher
        run: cd apps/teacher && cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build Student
        run: cd apps/student && cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SyncClassroom ${{ github.ref_name }}"
          files: |
            apps/teacher/src-tauri/target/release/bundle/nsis/*.exe
            apps/student/src-tauri/target/release/bundle/nsis/*.exe
