name: Build Branch Artifacts

on:
  push:
    branches:
      - "feature/*"
      - "feature-*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Get branch name
        id: branch
        run: |
          $branch = "${{ github.event.inputs.branch }}"
          if (-not $branch) { $branch = $env:GITHUB_REF -replace 'refs/heads/', '' }
          $branchName = $branch -replace '/', '-'
          echo "name=$branchName" >> $env:GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/teacher/src-tauri
            apps/student/src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate icons
        run: python build/convert-icons.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Build Teacher
        run: cd apps/teacher && cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Build Student
        run: cd apps/student && cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Rename installers
        run: |
          Get-ChildItem "apps/teacher/src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            $n = $_.Name -replace ' ', '-'
            if ($_.Name -ne $n) { Rename-Item $_.FullName $n }
          }
          Get-ChildItem "apps/student/src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            $n = $_.Name -replace ' ', '-'
            if ($_.Name -ne $n) { Rename-Item $_.FullName $n }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ steps.branch.outputs.name }}
          path: |
            apps/teacher/src-tauri/target/release/bundle/nsis/*.exe
            apps/student/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
